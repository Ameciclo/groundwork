name: ameciclo-infrastructure
runtime: nodejs
description: Ameciclo Azure infrastructure using Pulumi

template:
  config:
    # Azure auth is via the local `az login` session (Azure CLI default
    # credential chain) -- no azure-native:clientId/clientSecret/
    # subscriptionId/tenantId config is used or needed.
    location:
      description: The Azure region to deploy resources
      default: westus3
    adminSshPublicKey:
      description: SSH public key the VM accepts (also usable via Azure AD login -- see docs/connecting.md)
      secret: true
    entraAdminGroupObjectId:
      description: Object ID of the Entra ID group granted VM SSH login + Postgres admin access
